[package]
name = "crate-changelog"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Static site generator for crate-changelog.kxxt.dev: per-crate changelog redirects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kxxt/crate-changelog"
keywords = ["static-site", "changelog", "crates", "redirect"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
color-eyre = "0.6.5"
indicatif = "0.18.6"
palc = "0.0.2"
snafu = "0.9.2"
spdlog-rs = "0.5.3"

[profile.release]
lto = "thin"
strip = true
